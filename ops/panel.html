<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops Panel · Marigold Market</title>
<style>
  :root {
    --bg: #0e1411; --panel: #151d19; --line: #26332d; --ink: #e6efe9; --muted: #8fa399;
    --ok: #3ecf8e; --bad: #ff6b5e; --warn: #f5b84b; --accent: #6bb6ff;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .pill { font-family: var(--mono); font-size: 13px; padding: 5px 14px; border-radius: 999px; font-weight: 600; letter-spacing: .04em; }
  .pill.healthy { background: #123a29; color: var(--ok); }
  .pill.degraded { background: #4a1c18; color: var(--bad); animation: pulse 1.2s infinite; }
  .pill.down { background: #3a3417; color: var(--warn); }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .pill.degraded { animation: none; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .tile, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .tile .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .tile .v { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .v.bad { color: var(--bad); } .v.ok { color: var(--ok); }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  svg { width: 100%; height: 150px; display: block; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  li { font-size: 14px; border-left: 3px solid var(--line); padding-left: 10px; overflow-wrap: anywhere; }
  li.push { border-color: var(--accent); } li.rollback { border-color: var(--warn); } li.merge { border-color: var(--ok); }
  li.alert { border-color: var(--bad); } li.recovered { border-color: var(--ok); }
  li time { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; }
  .err { font-family: var(--mono); font-size: 12px; color: var(--bad); }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: #1d2823; color: var(--ink); padding: 10px 16px; border-radius: 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: wait; }
  button.danger { background: #5a1f1a; border-color: #8a3028; }
  button.fix { background: #124030; border-color: #1f6a4f; }
  a { color: var(--accent); }
  #toast { color: var(--muted); font-size: 13px; min-height: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ops panel<small>Marigold Market · localhost:8081</small></h1>
    <span id="pill" class="pill down">CONNECTING</span>
  </header>

  <div class="tiles">
    <div class="tile"><div class="k">Version live</div><div class="v" id="ver">…</div></div>
    <div class="tile"><div class="k">Error rate (30s)</div><div class="v" id="rate">…</div></div>
    <div class="tile"><div class="k">Sign-ins (30s)</div><div class="v" id="total">…</div></div>
    <div class="tile"><div class="k">Failed (30s)</div><div class="v" id="errs">…</div></div>
  </div>

  <div class="card">
    <h2>Sign-in traffic, last 4 minutes</h2>
    <svg id="chart" viewBox="0 0 960 150" preserveAspectRatio="none" role="img" aria-label="Requests per 5 seconds, errors in red"></svg>
    <div class="legend"><span><i style="background:var(--ok)"></i>successful</span><span><i style="background:var(--bad)"></i>server errors (500)</span></div>
  </div>

  <div class="cols">
    <div class="card"><h2>Deploys</h2><ul id="deploys"></ul></div>
    <div class="card"><h2>ops-sentinel alerts</h2><ul id="alerts"></ul></div>
    <div class="card"><h2>Latest errors</h2><ul id="errors"></ul></div>
  </div>

  <div class="card">
    <h2>Demo controls</h2>
    <div class="controls">
      <button id="push" class="danger">Push update v1.1</button>
      <button id="fix" class="fix" title="Backup: ships the prepared fix, skipping the agents">Ship prepared fix v1.1.1</button>
      <button id="traffic">Stop traffic</button>
      <button id="reset">Reset demo</button>
      <a href="http://localhost:8081" target="_blank" rel="noopener">Open the shop ↗</a>
    </div>
    <p id="toast"></p>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }).then((r) => r.json());
let trafficOn = true;

function li(cls, when, text) {
  const el = document.createElement("li");
  el.className = cls;
  const t = document.createElement("time");
  t.textContent = when;
  const d = document.createElement("div");
  d.textContent = text;
  el.append(t, d);
  return el;
}
function fill(ul, items, emptyText) {
  ul.replaceChildren();
  if (!items.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = emptyText; ul.append(e); return; }
  items.forEach((x) => ul.append(x));
}
const hhmmss = (iso) => iso ? new Date(iso).toLocaleTimeString() : "";

function drawChart(buckets) {
  const svg = $("chart"), W = 960, H = 150, pad = 4;
  const max = Math.max(10, ...buckets.map((b) => b.total));
  const bw = W / buckets.length;
  let out = "";
  buckets.forEach((b, i) => {
    const okH = ((b.total - b.errors) / max) * (H - pad), erH = (b.errors / max) * (H - pad);
    const x = i * bw + 1;
    out += `<rect x="${x}" y="${H - okH}" width="${bw - 2}" height="${okH}" fill="var(--ok)" opacity=".85"/>`;
    out += `<rect x="${x}" y="${H - okH - erH}" width="${bw - 2}" height="${erH}" fill="var(--bad)"/>`;
  });
  svg.innerHTML = out;
}

async function refresh() {
  let s;
  try { s = await (await fetch("/api/status")).json(); } catch { return; }
  const pill = $("pill");
  pill.className = "pill " + s.state;
  pill.textContent = s.state === "healthy" ? "HEALTHY" : s.state === "degraded" ? "DEGRADED" : "SHOP DOWN";
  $("ver").textContent = s.version || "none";
  const w = s.window;
  $("rate").textContent = w.total ? Math.round(w.rate * 100) + "%" : "n/a";
  $("rate").className = "v " + (w.total && w.rate >= 0.2 ? "bad" : "ok");
  $("total").textContent = w.total;
  $("errs").textContent = w.errors;
  $("errs").className = "v " + (w.errors ? "bad" : "");
  drawChart(s.buckets);
  fill($("deploys"), s.deploys.slice().reverse().map((d) =>
    li(d.action, hhmmss(d.at) + " · " + d.commit, (d.version || "") + " · " + d.action + (d.note ? ": " + d.note : ""))), "No deploys yet.");
  fill($("alerts"), s.alerts.slice().reverse().map((a) =>
    li(/RECOVERED/.test(a.text) ? "recovered" : "alert", hhmmss(a.ts), a.text)), "No alerts. The sentinel is watching.");
  fill($("errors"), s.recent_errors.slice().reverse().map((e) => {
    const el = li("alert", hhmmss(e.ts) + " · " + e.version, ""); el.lastChild.className = "err"; el.lastChild.textContent = e.error; return el; }), "No errors.");
  trafficOn = s.traffic;
  $("traffic").textContent = trafficOn ? "Stop traffic" : "Start traffic";
}

async function act(btn, label, fn) {
  btn.disabled = true; $("toast").textContent = label + "…";
  try { const r = await fn(); $("toast").textContent = r.output ? r.output.split("\n").pop() : "Done."; }
  catch { $("toast").textContent = "Action failed."; }
  btn.disabled = false; refresh();
}
$("push").onclick = (e) => act(e.target, "Pushing v1.1", () => post("/api/push", { release: "v1.1" }));
$("fix").onclick = (e) => act(e.target, "Shipping v1.1.1", () => post("/api/push", { release: "v1.1.1" }));
$("traffic").onclick = (e) => act(e.target, "Updating traffic", () => post("/api/traffic", { on: !trafficOn }));
$("reset").onclick = (e) => act(e.target, "Resetting", () => post("/api/reset"));

refresh(); setInterval(refresh, 1500);
</script>
</body>
</html>
